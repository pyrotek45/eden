[package]
name = "eden"
version = "0.1.0"
edition = "2021"
description = "A minimal DAW built with Rust and SDL2"

[dependencies]
# 0.38 checks unfamiliar backend event IDs instead of transmuting them into an enum.
sdl2 = { version = "0.38", features = ["gfx"] }
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
lewton = "0.10"
midly = "0.5"
